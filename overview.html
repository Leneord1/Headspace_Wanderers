<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
<div id="chart" style="width:100%; height:500px;"></div>

<script>

    // chart creation and data injection

    const myChart = echarts.init(document.getElementById('chart'));
    const val = __VAL__

    // chart settings

option = {
  tooltip: {
    formatter: '{a} <br/>{b} : {c}%'
  },
  series: [
    {
      name: 'Pressure',
      type: 'gauge',
      detail: {
        formatter: '{value}'
      },
      data: [
        {
          value: val,
          name: 'SCORE'
        }
      ]
    }
  ]
};

myChart.setOption(option);
</script>
</body>
</html>
